<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Language Companion</title>

  <link rel="stylesheet" href="/css/shared.css">
  <link rel="stylesheet" href="/css/robot.css">
</head>

<body>
  <main id="robot-screen">

    <img
      id="robot-pet"
      alt="Virtual language companion"
      hidden
    >

    <p id="robot-instruction" aria-live="polite">
      Waiting for the activity to begin...
    </p>

    <p id="robot-response" role="status" hidden></p>

    <button id="robot-pronunciation" type="button" hidden>
      Hear word
    </button>

    <p id="robot-speech-status" role="status" hidden></p>

  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/events.js"></script>
  <script src="/js/robot.js"></script>
</body>
</html>
